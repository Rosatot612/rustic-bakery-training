<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rustic Bakery · Video Reference</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #060c14;
    --bg-card: #0b1525;
    --bg-elevated: #0f1d30;
    --bg-hover: #142238;
    --accent: #E22027;
    --accent-dim: rgba(226,32,39,0.15);
    --text-primary: #f0f4f8;
    --text-secondary: #8aa0b8;
    --text-dim: #4a6480;
    --border: rgba(255,255,255,0.07);
    --border-active: rgba(226,32,39,0.5);
    --green: #2ecc71;
    --green-dim: rgba(46,204,113,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ── HEADER ── */
  .header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .synovate-logo svg { height: 24px; }
  .header-divider {
    width: 1px;
    height: 28px;
    background: var(--border);
  }
  .header-client {
    display: flex;
    align-items: center;
    gap: .6rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: .85rem;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }
  .header-client img {
    height: 28px;
    filter: invert(1);
    opacity: 0.85;
  }
  .lang-toggle {
    display: flex;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .lang-btn {
    padding: .3rem .75rem;
    font-size: .75rem;
    font-weight: 600;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: .08em;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    transition: all .2s;
  }
  .lang-btn.active {
    background: var(--accent);
    color: #fff;
  }

  /* ── HERO BANNER ── */
  .hero {
    background: linear-gradient(135deg, var(--bg-elevated) 0%, var(--bg-card) 100%);
    border-bottom: 1px solid var(--border);
    padding: 2rem 2.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .hero-text h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    margin-bottom: .25rem;
  }
  .hero-text p {
    font-size: .9rem;
    color: var(--text-secondary);
    max-width: 480px;
    line-height: 1.5;
  }
  .hero-badge {
    display: flex;
    align-items: center;
    gap: .5rem;
    background: var(--accent-dim);
    border: 1px solid var(--border-active);
    border-radius: 8px;
    padding: .5rem 1rem;
    font-size: .8rem;
    font-weight: 600;
    color: #ff6b6b;
    white-space: nowrap;
  }
  .hero-badge span { font-size: 1rem; }

  /* ── LAYOUT ── */
  .main {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 120px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--bg-card);
    border-right: 1px solid var(--border);
    padding: 1.5rem 0;
  }
  .sidebar-section-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 0 1.25rem .75rem;
  }
  .module-item {
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .75rem 1.25rem;
    cursor: pointer;
    transition: background .15s;
    border-left: 3px solid transparent;
  }
  .module-item:hover { background: var(--bg-hover); }
  .module-item.active {
    background: var(--bg-elevated);
    border-left-color: var(--accent);
  }
  .module-item.coming-soon { opacity: .5; cursor: default; }
  .module-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .75rem;
    font-weight: 700;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .module-item.active .module-num {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .module-info { flex: 1; min-width: 0; }
  .module-label {
    font-size: .7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .08em;
    font-family: 'Barlow Condensed', sans-serif;
  }
  .module-title {
    font-size: .85rem;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .module-item.coming-soon .module-title { color: var(--text-dim); }
  .badge-coming {
    font-size: .6rem;
    font-weight: 700;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: .08em;
    text-transform: uppercase;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: .1rem .35rem;
    border-radius: 4px;
    flex-shrink: 0;
  }

  /* ── VIDEO AREA ── */
  .content {
    padding: 2rem 2.5rem;
    max-width: 900px;
  }
  .video-header {
    margin-bottom: 1.25rem;
  }
  .video-module-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: .3rem;
  }
  .video-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: uppercase;
    margin-bottom: .4rem;
  }
  .video-desc {
    font-size: .9rem;
    color: var(--text-secondary);
    line-height: 1.55;
  }

  .video-wrapper {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }
  .video-wrapper iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }
  .video-coming {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg-elevated);
    gap: .75rem;
  }
  .video-coming-icon { font-size: 2.5rem; opacity: .4; }
  .video-coming-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* ── KEY POINTS ── */
  .key-points-heading {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: .75rem;
    font-weight: 700;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: .75rem;
  }
  .key-points {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: .6rem;
    margin-bottom: 2rem;
  }
  .key-point {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: .65rem .9rem;
    font-size: .83rem;
    color: var(--text-secondary);
    display: flex;
    align-items: flex-start;
    gap: .5rem;
    line-height: 1.4;
  }
  .key-point::before {
    content: '›';
    color: var(--accent);
    font-weight: 700;
    flex-shrink: 0;
    margin-top: .05rem;
  }

  /* ── NAV BUTTONS ── */
  .nav-buttons {
    display: flex;
    gap: .75rem;
    padding-top: .5rem;
    border-top: 1px solid var(--border);
  }
  .nav-btn {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .6rem 1.25rem;
    border-radius: 7px;
    font-size: .85rem;
    font-weight: 600;
    font-family: 'Barlow', sans-serif;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-secondary);
    transition: all .2s;
  }
  .nav-btn:hover:not(:disabled) {
    background: var(--bg-hover);
    color: var(--text-primary);
    border-color: rgba(255,255,255,0.15);
  }
  .nav-btn:disabled { opacity: .3; cursor: default; }
  .nav-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .nav-btn.primary:hover:not(:disabled) {
    background: #c81a20;
    border-color: #c81a20;
  }

  /* ── FOOTER ── */
  .footer {
    text-align: center;
    padding: 1.25rem;
    font-size: .75rem;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
  }
  .footer a { color: var(--text-dim); text-decoration: none; }
  .footer a:hover { color: var(--text-secondary); }

  @media (max-width: 700px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); padding: 1rem 0; }
    .content { padding: 1.25rem; }
    .hero { padding: 1.25rem; }
    .header { padding: 0 1rem; }
  }
</style>
</head>

      keyPoints: ['Inicia el cambio desde la pantalla de corrida activa', 'Registra la hora de inicio del cambio', 'Selecciona el nuevo producto y confirma las especificaciones', 'Reanuda el seguimiento de la corrida al completar el cambio']

const UI = {
  en: {
    headerTitle: 'Rustic Bakery · Quick Reference',
    heroTitle: 'Video Reference Library',
    heroDesc: 'Select any module to watch. Use this for quick refreshers on the floor — no login required.',
    heroBadge: 'Scan & Go — No Login Needed',
    sidebarLabel: 'Training Modules',
    kpHeading: 'Key Points',
    prev: 'Previous',
    next: 'Next Module',
    comingSoon: 'In Production',
    moduleLabel: m => `Module ${m}`
  },
  es: {
    headerTitle: 'Rustic Bakery · Referencia Rápida',
    heroTitle: 'Biblioteca de Videos de Referencia',
    heroDesc: 'Selecciona cualquier módulo para ver. Úsalo para repasos rápidos en el piso — sin inicio de sesión.',
    heroBadge: 'Escanea y listo — Sin Inicio de Sesión',
    sidebarLabel: 'Módulos de Entrenamiento',
    kpHeading: 'Puntos Clave',
    prev: 'Anterior',
    next: 'Siguiente Módulo',
    comingSoon: 'En Producción',
    moduleLabel: m => `Módulo ${m}`
  }
};

let state = { lang: 'en', current: 0 };

function setLang(lang) {
  state.lang = lang;
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-es').classList.toggle('active', lang === 'es');
  applyUI();
  renderSidebar();
  loadModule(state.current);
}

function applyUI() {
  const u = UI[state.lang];
  document.getElementById('header-title').textContent = u.headerTitle;
  document.getElementById('hero-title').textContent = u.heroTitle;
  document.getElementById('hero-desc').textContent = u.heroDesc;
  document.getElementById('hero-badge-text').textContent = u.heroBadge;
  document.getElementById('sidebar-label').textContent = u.sidebarLabel;
  document.getElementById('kp-heading').textContent = u.kpHeading;
  document.getElementById('btn-prev-label').textContent = u.prev;
  document.getElementById('btn-next-label').textContent = u.next;
}

function renderSidebar() {
  const u = UI[state.lang];
  const container = document.getElementById('sidebar-modules');
  container.innerHTML = MODULES.map((m, i) => {
    const data = m[state.lang];
    const isActive = i === state.current;
    const isAvailable = !!m.videoSrc;
    return `
      <div class="module-item ${isActive ? 'active' : ''} ${!isAvailable ? 'coming-soon' : ''}"
           onclick="${isAvailable ? `selectModule(${i})` : ''}">
        <div class="module-num">${m.id}</div>
        <div class="module-info">
          <div class="module-label">${u.moduleLabel(m.id)}</div>
          <div class="module-title">${data.title}</div>
        </div>
        ${!isAvailable ? `<span class="badge-coming">${u.comingSoon}</span>` : ''}
      </div>`;
  }).join('');
}

function loadModule(index) {
  const m = MODULES[index];
  const data = m[state.lang];
  const u = UI[state.lang];

  document.getElementById('mod-label').textContent = u.moduleLabel(m.id);
  document.getElementById('mod-title').textContent = data.title;
  document.getElementById('mod-desc').textContent = data.desc;

  const wrapper = document.getElementById('video-wrapper');
  if (m.videoSrc) {
    wrapper.innerHTML = `<iframe src="${m.videoSrc}" allow="autoplay" allowfullscreen></iframe>`;
  } else {
    wrapper.innerHTML = `
      <div class="video-coming">
        <div class="video-coming-icon">🎬</div>
        <div class="video-coming-text">${u.comingSoon}</div>
      </div>`;
  }

  document.getElementById('key-points').innerHTML = data.keyPoints
    .map(kp => `<div class="key-point">${kp}</div>`)
    .join('');

  document.getElementById('btn-prev').disabled = index === 0;
  document.getElementById('btn-next').disabled = index === MODULES.length - 1;
}

function selectModule(index) {
  state.current = index;
  renderSidebar();
  loadModule(index);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function navigate(dir) {
  const next = state.current + dir;
  if (next >= 0 && next < MODULES.length) selectModule(next);
}

// Init
applyUI();
renderSidebar();
loadModule(0);
</script>
